[package]
name = "db-designer"
version = "1.0.2"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# 包内存在多个 bin（桌面应用 + dbd CLI）时，必须显式指定主二进制供 tauri CLI 识别
default-run = "db-designer"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "db_designer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# db-designer 只读命令行（v1 仅本地只读命令 + skill 安装），复用上方 lib 层，不打包进安装器
[[bin]]
name = "dbd"
path = "src/bin/dbd.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.10"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
dotenv = "0.15.0"
dirs = "6"
mysql = "25"
postgres = "0.19"
oracle = "0.5"
native-tls = "0.2"
postgres-native-tls = "0.5"
regex = "1"
# 仅启用 https feature：Token/HTTPS 同步走内嵌 git2。libgit2 的 HTTPS 在 Windows 上
# 用系统 Schannel，但在 macOS/Linux 上依赖 OpenSSL——必须 vendored-openssl 从源码编译，
# 否则 CI 在 ARM runner 上交叉编译 x86_64-apple-darwin 时找不到系统 OpenSSL。
# SSH 模式另走系统 git CLI（见 git.rs），故不启用 ssh feature，避免拉入 libssh2。
git2 = { version = "0.21", features = ["https", "vendored-openssl"] }
tauri-plugin-http = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time", "rt"] }
# dbd CLI：参数解析、发布包校验、版本比较
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
semver = "1"

# dbd CLI Windows 专属：用户 PATH 注册表读写与环境变量变更广播
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Console"] }
