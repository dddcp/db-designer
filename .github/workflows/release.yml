name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            triple: x86_64-pc-windows-msvc
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            triple: aarch64-apple-darwin
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            triple: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            triple: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DB Designer ${{ github.ref_name }}'
          releaseBody: |
            ### 🚀 自动发布
            查看完整更新说明：[CHANGELOG.md](https://github.com/dddcp/db-designer/blob/main/CHANGELOG.md)
            ---
            > ℹ️ `dbd-*` 为命令行工具（通常由应用内「设置 → Agent CLI」一键安装），普通用户无需手动下载。
            ---
            *此版本由 GitHub Actions 自动构建并发布*
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # dbd CLI 独立分发：不进安装包，附加到同一 Release（应用内“安装/更新 CLI”从此下载）
      - name: Build dbd CLI
        working-directory: src-tauri
        shell: bash
        run: |
          # macOS 交叉编译需显式 --target（与 tauri-action 的 target 目录一致，复用缓存）；
          # Windows/Linux 与 tauri-action 一样用默认 host triple，直接复用已编译的 target/release，避免全量重编
          if [[ "${{ matrix.platform }}" == macos* ]]; then
            cargo build --release --bin dbd --target ${{ matrix.triple }}
            REL="target/${{ matrix.triple }}/release"
          else
            cargo build --release --bin dbd
            REL="target/release"
          fi
          EXT=""
          if [[ "${{ matrix.platform }}" == windows* ]]; then EXT=".exe"; fi
          ASSET="dbd-${{ matrix.triple }}${EXT}"
          # 产物复制到仓库根，供下一步 Upload dbd CLI assets（files 相对仓库根）上传
          cp "$REL/dbd$EXT" "../$ASSET"
          cd ..
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ASSET" > "$ASSET.sha256"
          else
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          fi
          ls -la dbd-*

      - name: Upload dbd CLI assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: dbd-*
